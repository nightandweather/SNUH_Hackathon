<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-MIMIC · Surgical ICU</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#20354b;font:15px/1.6 system-ui,sans-serif}header{background:#162b43;color:white;padding:22px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:24px}h2{font-size:20px;margin:0 0 10px}h3{font-size:16px}small,.muted{color:#61758a;font-size:13px}header small{color:#bfcede}button,select,input{font:inherit}button,select{min-height:42px;padding:7px 13px;border:1px solid #becddd;border-radius:7px;color:#20354b;background:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #337ac0;outline-offset:3px}main{max-width:1500px;margin:auto;padding:24px}.notice{background:#e9f2fc;border-left:4px solid #397bb5;padding:14px 18px;margin-bottom:20px}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0}.toolbar strong{margin-right:auto}.panel{background:white;border:1px solid #d7e1eb;border-radius:12px;padding:22px;margin-bottom:20px}.beds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:24px;background:#edf2f7;border:1px solid #d4dee8;border-radius:12px}.bed{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-height:166px;background:white;border:2px solid #a7bfd3;text-align:left;box-shadow:0 3px 0 #d5e0ea}.bed.flag{border-color:#b87527;background:#fffaf1}.bed.missing{border-style:dashed}.bed b{font-size:16px}.bed > svg{width:100%;height:36px;pointer-events:none}.bed .state{font-size:12px;font-weight:650}.bed .values{font-size:12px;color:#435c73}.bed .top{display:flex;justify-content:space-between;gap:8px}.bed .slot{color:#74869b;font-size:12px}.bed:disabled{background:#f5f7f9}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#5a6f84;margin-top:15px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fact{padding:14px;background:#f5f8fb;border:1px solid #dae3ec;border-radius:8px}.fact b{display:block;font-size:20px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e0e8ef}dialog{width:min(850px,94vw);max-height:88vh;border:1px solid #bbcddd;border-radius:14px;padding:0;color:#20354b}dialog::backdrop{background:#10243d99}.dialog-head{position:sticky;top:0;background:white;display:flex;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid #d7e1eb;z-index:1}.dialog-head h2{margin:0}.dialog-body{padding:20px 24px}.close{min-width:100px;background:#e9f1fa;font-weight:700}.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.vital{background:#f3f7fb;padding:12px;border-radius:8px}.vital strong{font-size:23px;display:block}.vital small{font-size:11px}.unknown{color:#69788a}.error{color:#9a2534}#error:empty{display:none}.trend{width:100%;height:100px}.trend path{fill:none;stroke:#2878b6;stroke-width:2}.trend text{font:10px system-ui;fill:#6b7a8d}@media(max-width:850px){.beds{grid-template-columns:repeat(2,1fr);padding:14px;gap:12px}.vitals{grid-template-columns:repeat(3,1fr)}.facts{grid-template-columns:1fr}header{padding:18px}main{padding:14px}}@media(max-width:450px){.beds{grid-template-columns:1fr}.vitals{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div><small>K-MIMIC · SOURCE RECORDS</small><h1 id="title"></h1></div><button id="language">English</button></header><main><div class="notice" id="notice"></div><div id="error" role="alert"></div><p><a href="workbook.xlsx" id="xlsx">Excel</a> · <a href="workbook-preview.html" id="xlsxPreview">Preview</a></p><p><a href="cohort/preview.html">전체 K-MIMIC 외과 ICU 추출 결과 · Full-cohort extraction</a></p><div class="panel"><div class="facts" id="facts"></div><div class="toolbar"><strong id="ward"></strong><button id="prev">←</button><span id="page"></span><button id="next">→</button><label id="timeLabel" for="time"></label><select id="time"></select></div><p class="muted" id="slots"></p><div class="beds" id="beds"></div><div class="legend" id="legend"></div></div><section class="panel"><h2 id="listTitle"></h2><div class="table-wrap"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div></section></main><dialog id="detail"><div class="dialog-head"><h2 id="detailTitle"></h2><button class="close" id="close"></button></div><div class="dialog-body" id="detailBody"></div></dialog>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));</script><script src="network.js"></script><script src="anatomy.js"></script><script src="grounded-chat.js"></script><script src="patient-detail.js"></script><script>
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ko',data,page=0,time='initial',selected=null;
const $=s=>document.querySelector(s),t=(ko,en)=>lang==='ko'?ko:en;
const names={hr:['심박수','Heart rate','bpm'],map:['평균동맥압','MAP','mmHg'],spo2:['산소포화도','SpO₂','%'],rr:['호흡수','Respiratory rate','/min'],sbp:['수축기혈압','SBP','mmHg']};
const careNames=[['당일 CPR','CPR today'],['ECMO / CRRT','ECMO / CRRT'],['승압제 증량·불안정','Pressor escalation / unstable'],['인공호흡기','Ventilator'],['당일 수술','Surgery today']];
const at=c=>time==='initial'?c.rows[c.initial]:c.rows[Math.floor(Number(time)/c.step)];
function support(c,r){const minute=r?.minute??(time==='initial'?0:Number(time));const events=(c.device_events?.ventilator||[]).filter(e=>e.minute<=minute);const latest=events.at(-1);const same=events.filter(e=>e.minute===latest?.minute);const known=latest&&minute-latest.minute<=30&&same.every(e=>e.active===latest.active);return {...c,devices:{ventilator:known?latest.active:null},ventEvidence:known?latest:null};}
const procedureCount=(c,r)=>c.procedure_table_available?(c.procedures||[]).filter(e=>e.end_min<=(r?.minute??(time==='initial'?0:Number(time)))).length:null;
const flags=r=>!r?[]:[['hr',v=>v<40||v>140],['map',v=>v<60],['spo2',v=>v<88],['rr',v=>v>35]].filter(([k,p])=>r.vitals[k]!=null&&p(r.vitals[k])).map(([k])=>k);
const state=r=>!r||Object.values(r.vitals).some(v=>v==null)?t('관측값 일부 미확인','Incomplete observations'):flags(r).length?t('참고 기준 이탈','Reference threshold crossed'):t('표시 기준 이탈 없음','No displayed threshold crossed');
const value=v=>v==null?'—':esc(v);
function render(){
 document.documentElement.lang=lang;$('#title').textContent=t('외과 중환자실 · 실제 기록 재생','Surgical ICU · source-record replay');$('#language').textContent=lang==='ko'?'English':'한국어';$('#close').textContent=t('✕ 닫기','✕ Close');
 $('#notice').textContent=t('실제 K-MIMIC 과거 입실 기록입니다. 각 칸은 서로 다른 입실 사례의 표시 위치이며, 동일 시각의 병상 점유나 현재 수용 가능 병상을 의미하지 않습니다. 인력·장비·처치 기록은 확인된 항목만 표시합니다.','Historical K-MIMIC admissions. Slots show separate cases, not simultaneous occupancy or current bed availability. Staff, device and treatment status require verified source records.');
 $('#xlsx').textContent=t('실제 기록 Excel 다운로드','Download source-record Excel');$('#xlsxPreview').textContent=t('엑셀 미리보기','Workbook preview');if(!data)return;const cases=data.cases.slice(page*8,page*8+8);
 $('#facts').innerHTML=`<div class="fact">${t('자료 출처','Source')}<b>${esc(data.cases[0].dataset)}</b><small>${t('파티션','Partition')} ${esc(data.cases[0].partition)} · ICUSTAYS + CHARTEVENTS</small></div><div class="fact">${t('검사된 입실 사례','Replay admissions')}<b>${data.count}</b><small>${t('단일 파티션 편의 표본 · 모집단 대표성 없음','Single-partition convenience sample · not representative')}</small></div><div class="fact">${t('시간 정렬','Time alignment')}<b>${t('ICU 입실 후 상대 시간','Minutes since ICU admission')}</b><small>${t('미래 관측값 사용 안 함 · 30분 초과 값 미표시','No future observations · values older than 30 min hidden')}</small></div>`;
 $('#ward').textContent=t('외과 중환자실 · SICU','Surgical ICU · SICU');$('#page').textContent=`${page+1} / ${Math.ceil(data.count/8)}`;$('#prev').disabled=page===0;$('#next').disabled=(page+1)*8>=data.count;
 $('#timeLabel').textContent=t('관측 시점','Observation time');$('#time').innerHTML=`<option value="initial">${t('사례별 최초 완전 관측 구간','First complete window per case')}</option>`+Array.from({length:24},(_,i)=>`<option value="${i*60}">ICU + ${i} h</option>`).join('');if(time!=='initial'&&!Array.from($('#time').options).some(o=>o.value===time))$('#time').add(new Option('ICU + '+time+' min',time));$('#time').value=time;
 $('#slots').textContent=t('실제 병상 번호가 아닌 8개 표시 슬롯입니다. 각 사례의 재생 시각을 확인하세요. 병원 식별 정보는 데이터셋 코드로만 표시합니다.','Eight display slots, not real bed numbers. Check the replay time for each case. The dataset code does not identify a named hospital.');
 $('#beds').innerHTML=Array.from({length:8},(_,i)=>{const c=cases[i];if(!c)return `<button class="bed" disabled>${t('이 페이지의 추가 사례 없음','No additional case on this page')}</button>`;const r=at(c);return `<button class="bed ${flags(r).length?'flag':''} ${!r||Object.values(r.vitals).some(v=>v==null)?'missing':''}" data-case="${page*8+i}"><span class="top"><b>${c.id}</b><span class="slot">${t('표시 슬롯','Slot')} ${i+1}</span></span><svg viewBox="-.1 -.1 4.7 1.1" aria-label="${t('기록 기반 장비·처치 상태','Source-based care indicators')}">${Network.careMapIcons(support(c,r))}</svg><span class="state">${state(r)}</span><span class="values">HR ${value(r?.vitals.hr)} · MAP ${value(r?.vitals.map)} · SpO₂ ${value(r?.vitals.spo2)}</span><small>ICU + ${r?.minute??Number(time)} min · ${t('종료 처치 기록','Ended procedure rows')} ${value(procedureCount(c,r))}</small></button>`}).join('');
 $('#legend').innerHTML=careNames.map(([ko,en])=>`<span>${t(ko,en)}</span>`).join('')+`<span>${t('미확인 ≠ 미사용 · 중증도 점수 아님','Unknown ≠ not used · not a severity score')}</span>`;
 $('#listTitle').textContent=t('환자 사례 · 기록 요약','Cases · record summary');$('#thead').innerHTML=`<tr>${[t('사례','Case'),t('병동','Ward'),t('재생 시점','Replay time'),'HR','MAP','SpO₂','RR','SBP'].map(x=>`<th>${x}</th>`).join('')}</tr>`;
 $('#rows').innerHTML=cases.map(c=>{const r=at(c);return `<tr><td>${c.id}</td><td>${c.unit}</td><td>+${r?.minute??Number(time)} min</td>${Object.keys(names).map(k=>`<td>${value(r?.vitals[k])}</td>`).join('')}</tr>`}).join('');
 $('#beds').querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(Number(b.dataset.case)));
}
function openCase(index){selected=index;const c=data.cases[index],r=at(c);$('#detailTitle').textContent=`${c.id} · Digital Twin`;
 $('#detailBody').innerHTML=`<p class="muted">${esc(c.dataset)} / ${esc(c.partition)} · ${c.unit} · ICU + ${r?.minute??Number(time)} min</p><div class="vitals">${Object.entries(names).map(([k,[ko,en,u]])=>`<div class="vital">${t(ko,en)}<strong>${value(r?.vitals[k])}</strong><small>${u} · ${r?.age[k]!=null?t(`${r.age[k]}분 전 관측`,`${r.age[k]} min old`):t('미확인','Unknown')}</small></div>`).join('')}</div>${PatientDetail.render(c,lang)}${Anatomy.render(c,lang)}<h3>${t('기록 기반 요약','Record-based summary')}</h3><p>${state(r)}. ${t('값은 원본 관측값을 상대 시간에 정렬한 것입니다. 이번 입원 진단은 기록 시각이 없어 후향적으로만 표시하며, 출혈 여부·수술 종류를 임의로 추정하지 않습니다.','Values are source observations aligned to relative admission time. Untimed admission diagnoses are retrospective only. Bleeding and surgery type are not inferred.')}</p><h3>${t('종료 처치 기록','Ended procedure records')}: ${value(procedureCount(c,r))}</h3><p>${t('입실 후 선택 시점까지 종료 시간이 확인된 PROCEDUREEVENTS 기록 행 수입니다. 같은 수술에 여러 기록이 있을 수 있어 독립 처치 건수나 간호사 업무량과 같지 않습니다. 시행 간호사 연결 정보는 없습니다.','Count of PROCEDUREEVENTS rows ending between admission and the selected time. A surgery may have multiple rows; this is not a count of unique procedures or nurse workload. Performing nurses are not mapped.')}</p><details><summary>${t('집계 근거 보기','View counted records')}</summary><ul>${(c.procedures||[]).filter(e=>e.end_min<=(r?.minute??(time==='initial'?0:Number(time)))).map(e=>`<li>${esc(e.itemid)} · ${esc(e.category)} · +${Math.round(e.start_min)}–${Math.round(e.end_min)} min</li>`).join('')||t('이 범위에서 연결된 종료 기록 없음','No linked ended records in this interval')}</ul></details><h3>${t('장비·처치 연결 상태','Device and treatment mapping')}</h3><p>${t('인공호흡기는 원본 ON/OFF 기록으로 확인합니다. 30분 이내 기록만 표시하며, 다른 장비·처치는 아직 연결되지 않아 미확인입니다.','Ventilator status uses explicit source ON/OFF records within 30 minutes. Other treatments and devices remain unmapped and unknown.')}</p><ul>${careNames.map(([ko,en],i)=>`<li>${t(ko,en)}: ${i===3&&support(c,r).devices.ventilator!=null?(support(c,r).devices.ventilator?t('ON 기록','Recorded ON'):t('OFF 기록','Recorded OFF')):t('미확인','Unknown')}</li>`).join('')}</ul><p class="muted">${support(c,r).ventEvidence?esc('CHARTEVENTS · '+support(c,r).ventEvidence.itemid+' · VALUE='+support(c,r).ventEvidence.raw+' · ICU +'+support(c,r).ventEvidence.minute+' min'):''}</p><h3>${t('최근 2시간 관측 추이','Last two hours of observations')}</h3><div id="trends"></div><p class="muted">${t('30분까지만 이전 관측값을 유지하며 이후에는 빈 값으로 표시합니다. 일반 ICU 코드나 수술 플래그만으로 외과 ICU를 추정하지 않습니다. 실제 병상 배치·간호사 배정·CXR는 연결되지 않았습니다.','Prior observations are carried forward for at most 30 minutes, then shown as missing. Surgical ICU is selected by explicit SICU code. Actual bed assignment, staffing and CXR are not linked.')}</p>`;
 for(const [k,[ko,en,u]] of Object.entries(names)){const idx=r?c.rows.indexOf(r):-1,rows=idx<0?[]:c.rows.slice(Math.max(0,idx-24),idx+1);const valid=rows.filter(x=>x.vitals[k]!=null);const box=document.createElement('div');box.innerHTML=`<b>${t(ko,en)} (${u})</b>`;if(!valid.length)box.insertAdjacentHTML('beforeend',`<p class="muted">${t('해당 구간에 관측값 없음','No observations in this interval')}</p>`);else{let lo=Math.min(...valid.map(x=>x.vitals[k])),hi=Math.max(...valid.map(x=>x.vitals[k]));if(hi===lo){lo-=1;hi+=1}let d='',connected=false;rows.forEach((x,i)=>{if(x.vitals[k]==null){connected=false;return}d+=`${connected?'L':'M'}${10+i*580/Math.max(1,rows.length-1)},${75-(x.vitals[k]-lo)*55/(hi-lo)} `;connected=true;});box.insertAdjacentHTML('beforeend',`<svg class="trend" viewBox="0 0 600 100" role="img" aria-label="${t(ko,en)}"><text x="10" y="10">${hi}</text><path d="${d}"/><text x="10" y="95">+${rows[0].minute} min</text><text x="510" y="95">+${rows.at(-1).minute} min</text></svg>`)}$('#trends').append(box)}
 PatientDetail.mount($('#detailBody'),c,r?c.rows.indexOf(r):-1,lang);
 GroundedChat.mount($('#detailBody'),c,r?c.rows.indexOf(r):-1,lang,next=>{time=String(c.rows[next].minute);render();openCase(index);});
 if(!$('#detail').open)$('#detail').showModal();$('#close').focus();
}
$('#detail').addEventListener('close',()=>GroundedChat.close());
$('#close').onclick=()=>$('#detail').close();$('#language').onclick=()=>{lang=lang==='ko'?'en':'ko';render();if($('#detail').open)openCase(selected)};$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};$('#time').onchange=e=>{time=e.target.value;render()};render();fetch('api/cases').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;render()}).catch(e=>{$('#error').textContent=t('실제 데이터 로드 실패: ','Source data unavailable: ')+e.message});
</script></body></html>
