services:
  pericare:
    build: .
    image: pericare-prototype:6.1
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      MODEL_BACKEND: ${MODEL_BACKEND:-demo}
      MODEL_URL: ${MODEL_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - pericare_data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pericare_data:
